name: release

# Push a tag like v0.4.1 (must match Cargo.toml) to build static Linux binaries
# and publish them as a GitHub release. No third-party actions: only `gh` and rustup
# from the runner image, plus actions/checkout pinned to a commit.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.ref_name }}

jobs:
  draft:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must match Cargo.toml version
        run: |
          v="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$v" != "$TAG" ]; then echo "::error::tag $TAG does not match Cargo.toml $v"; exit 1; fi
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --draft --verify-tag --title "memdex $TAG" --generate-notes

  build:
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (static musl via rust-lld / static-CRT msvc, see .cargo/config.toml)
        run: rustup toolchain install stable --profile minimal --target "$TARGET" && rustup default stable
      - name: Test
        run: cargo test --locked --release
      - name: Build
        run: cargo build --locked --release --target "$TARGET"
      - name: Package
        run: |
          name="memdex-$TARGET"
          mkdir -p "dist/$name"
          case "$TARGET" in
            *windows*)
              bin="target/$TARGET/release/memdex.exe"
              # Static CRT: the exe must not need the VC++ redistributable.
              if grep -qai 'vcruntime140' "$bin"; then echo "::error::memdex.exe links the dynamic CRT"; exit 1; fi
              asset="$name.zip" ;;
            *)
              bin="target/$TARGET/release/memdex"
              file "$bin" | tee /dev/stderr | grep -Eq 'static(ally|-pie) linked'
              cp -r deploy "dist/$name/"
              asset="$name.tar.gz" ;;
          esac
          "$bin" --version | tr -d '\r' | grep -qx "memdex ${TAG#v}"
          cp "$bin" README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          if [ "${asset##*.}" = zip ]; then
            (cd dist && pwsh -NoProfile -Command "Compress-Archive -Path '$name' -DestinationPath '$asset'")
          else
            tar -C dist -czf "dist/$asset" "$name"
          fi
          assets="$asset"
          # Linux: also a .deb (static binary, no dependencies).
          case "$TARGET" in
            x86_64-unknown-linux-musl) assets="$assets $(basename "$(packaging/deb/build-deb.sh "$bin" "${TAG#v}" amd64 dist)")" ;;
            aarch64-unknown-linux-musl) assets="$assets $(basename "$(packaging/deb/build-deb.sh "$bin" "${TAG#v}" arm64 dist)")" ;;
          esac
          for a in $assets; do (cd dist && sha256sum "$a" | sed 's/ \*/  /' > "$a.sha256" && cat "$a.sha256"); done
          echo "ASSETS=$assets" >> "$GITHUB_ENV"
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: for a in $ASSETS; do gh release upload "$TAG" "dist/$a" "dist/$a.sha256" --clobber; done

  installers:
    # Windows setup.exe for x64 and ARM64, built with the runner's Inno Setup from the
    # zips the build job uploaded (so the ARM runner doesn't need Inno Setup).
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          ver="${TAG#v}"
          mkdir -p dl dist
          for pair in x86_64:x64 aarch64:arm64; do
            t="${pair%%:*}-pc-windows-msvc"; arch="${pair##*:}"
            gh release download "$TAG" -p "memdex-$t.zip" -p "memdex-$t.zip.sha256" -D dl --clobber
            (cd dl && sha256sum -c "memdex-$t.zip.sha256")
            (cd dl && 7z x -y "memdex-$t.zip" >/dev/null)
            "$iscc" //Q "//DAppVersion=$ver" "//DArch=$arch" "//DSrcDir=$(cygpath -wa "dl/memdex-$t")" \
              "//DOutDir=$(cygpath -wa dist)" "$(cygpath -wa packaging/windows/memdex.iss)"
            setup="memdex-$ver-$arch-setup.exe"
            (cd dist && sha256sum "$setup" | sed 's/ \*/  /' > "$setup.sha256" && cat "$setup.sha256")
            gh release upload "$TAG" "dist/$setup" "dist/$setup.sha256" --clobber
          done

  publish:
    needs: [build, installers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest
