name: release

# Push a tag like v0.4.1 (must match Cargo.toml) to build static Linux binaries
# and publish them as a GitHub release. No third-party actions: only `gh` and rustup
# from the runner image, plus actions/checkout pinned to a commit.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.ref_name }}

jobs:
  draft:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must match Cargo.toml version
        run: |
          v="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$v" != "$TAG" ]; then echo "::error::tag $TAG does not match Cargo.toml $v"; exit 1; fi
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --draft --verify-tag --title "memdex $TAG" --generate-notes

  build:
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (static musl via rust-lld / static-CRT msvc, see .cargo/config.toml)
        run: rustup toolchain install stable --profile minimal --target "$TARGET" && rustup default stable
      - name: Test
        run: cargo test --locked --release
      - name: Build
        run: cargo build --locked --release --target "$TARGET"
      - name: Package
        run: |
          name="memdex-$TARGET"
          mkdir -p "dist/$name"
          case "$TARGET" in
            *windows*)
              bin="target/$TARGET/release/memdex.exe"
              # Static CRT: the exe must not need the VC++ redistributable.
              if grep -qai 'vcruntime140' "$bin"; then echo "::error::memdex.exe links the dynamic CRT"; exit 1; fi
              asset="$name.zip" ;;
            *)
              bin="target/$TARGET/release/memdex"
              file "$bin" | tee /dev/stderr | grep -Eq 'static(ally|-pie) linked'
              cp -r deploy "dist/$name/"
              asset="$name.tar.gz" ;;
          esac
          "$bin" --version | tr -d '\r' | grep -qx "memdex ${TAG#v}"
          cp "$bin" README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          if [ "${asset##*.}" = zip ]; then
            (cd dist && pwsh -NoProfile -Command "Compress-Archive -Path '$name' -DestinationPath '$asset'")
          else
            tar -C dist -czf "dist/$asset" "$name"
          fi
          (cd dist && sha256sum "$asset" | sed 's/ \*/  /' > "$asset.sha256" && cat "$asset.sha256")
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "dist/$ASSET" "dist/$ASSET.sha256" --clobber

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest
